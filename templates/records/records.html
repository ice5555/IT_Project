{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h2 class="text-center mb-4">财务记录</h2>

        <!-- 筛选按钮 -->
        <div class="mb-4 text-center">
            <button class="btn btn-secondary" onclick="filterRecords('all')">全部</button>
            <button class="btn btn-primary" onclick="filterRecords('expense')">支出</button>
            <button class="btn btn-success" onclick="filterRecords('income')">收入</button>
        </div>

        <!-- 搜索框 -->
        <input type="text" id="search-input" class="form-control mb-4" placeholder="搜索记录..." oninput="filterRecords(currentFilter)">
        
        <!-- 记录列表容器 -->
        <div id="records-container"></div>
    </div>
</div>

<script>
    let currentFilter = 'all';
    
    async function fetchRecords() {
        try {
            const response = await fetch('/api/records/');
            const data = await response.json();
            renderRecords(data);
        } catch (error) {
            console.error('Error:', error);
        }
    }

    // 渲染记录
    function renderRecords(data) {
        const container = document.getElementById('records-container');
        container.innerHTML = "";

        const filteredData = data.filter(record => {
            if (currentFilter === 'expense') return record.type === 'expense';
            if (currentFilter === 'income') return record.type === 'income';
            return true;
        });

        filteredData.forEach(record => {
            const row = `
                <div class="card mb-3">
                    <div class="card-body">
                        <h5>${record.source || record.product_name}</h5>
                        <p>类别: ${record.category}</p>
                        <p>金额: £${record.amount.toFixed(2)}</p>
                        <p>日期: ${new Date(record.date).toLocaleDateString()}</p>
                        <p>备注: ${record.note || '-'}</p>
                        <a href="${record.type === 'expense' ? '/edit-expense/' : '/edit-income/'}?id=${record.id}" class="btn btn-warning btn-sm">编辑</a>
                    </div>
                </div>`;
            container.innerHTML += row;
        });
    }

    // 筛选记录
    function filterRecords(filter) {
        currentFilter = filter;
        fetchRecords();
    }

    // 页面加载时获取数据
    document.addEventListener('DOMContentLoaded', fetchRecords);
</script>
{% endblock %}
