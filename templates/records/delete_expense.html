{% extends 'base.html' %}

{% block title %}删除支出记录{% endblock %}

{% block content %}
<h2 class="mb-4">删除支出记录</h2>

<p>你确定要删除这条支出记录吗？</p>

<p><strong>{{ expense.description }} - ¥{{ expense.current_price }}</strong></p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">删除</button>
    <a href="{% url 'expense_list' %}" class="btn btn-secondary">取消</a>
</form>

{% endblock %}
