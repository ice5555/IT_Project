<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}记账系统{% endblock %}</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .container { max-width: 900px; margin-top: 20px; }
        .navbar { margin-bottom: 20px; }
    </style>
    <!-- 引入 jQuery 和 jQuery UI（用于自动补全） -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'overview' %}">记账系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'overview' %}">总览</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'expense_list' %}">支出记录</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'income_list' %}">收入记录</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'overview_charts' %}">可视化分析</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'income_list_trend' %}">收入趋势分析析</a></li>

                
                </ul>
                <ul class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                        <li class="nav-item"><a class="nav-link" href="#">{{ user.username }}</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'export_expenses' %}">导出支出</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'import_expenses' %}">导入支出</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'export_incomes' %}">导出收入</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'import_incomes' %}">导入收入</a></li>
                
                        <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">注销</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">登录</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'accounts:register' %}">注册</a></li>
                        {% endif %}
                </ul>
            </div>
        </div>
    </nav>
    
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- 引入 Bootstrap JS 和 Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}

</body>
</html>
