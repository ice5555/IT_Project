{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>收入趋势分析</h2>

    <!-- 筛选表单 -->
    <div class="row mb-4">
        <div class="col-md-4">
            <label for="sourceSelect">收入来源</label>
            <select id="sourceSelect" class="form-control">
                <option value="">全部</option>
                {% for source in sources %}
                <option value="{{ source }}">{{ source }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label for="categorySelect">收入类别</label>
            <select id="categorySelect" class="form-control">
                <option value="">全部</option>
                {% for category in categories %}
                <option value="{{ category }}">{{ category }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4">
            <label for="daysSelect">时间范围</label>
            <select id="daysSelect" class="form-control">
                <option value="7">过去7天</option>
                <option value="15">过去15天</option>
                <option value="30" selected>过去30天</option>
            </select>
        </div>
    </div>

    <!-- 折线图 -->
    <canvas id="incomeTrendChart" width="400" height="200"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const ctx = document.getElementById('incomeTrendChart').getContext('2d');
    let incomeChart = null;

    function fetchData() {
        const source = document.getElementById('sourceSelect').value;
        const category = document.getElementById('categorySelect').value;
        const days = document.getElementById('daysSelect').value;

        const url = `/api/income-trend/?source=${source}&category=${category}&days=${days}`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                updateChart(data.labels, data.data);
            });
    }

    function updateChart(labels, data) {
        if (incomeChart) {
            incomeChart.destroy();
        }

        incomeChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: '收入趋势',
                    data: data,
                    borderColor: '#36A2EB',
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    fill: true
                }]
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: '日期'
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: '收入金额'
                        }
                    }
                }
            }
        });
    }

    // 监听筛选条件变化
    document.getElementById('sourceSelect').addEventListener('change', fetchData);
    document.getElementById('categorySelect').addEventListener('change', fetchData);
    document.getElementById('daysSelect').addEventListener('change', fetchData);

    // 初始化加载数据
    fetchData();
});
</script>
{% endblock %}
