{% extends "base.html" %}
{% load static %}

{% block title %}Add Budget{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">Add Budget</h3>
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="id_category" class="form-label">Category</label>
          {{ form.category }}
        </div>
        <div class="mb-3">
          <label for="id_amount" class="form-label">Budget Amount</label>
          {{ form.amount }}
        </div>
        <div class="mb-3">
          <label for="id_threshold" class="form-label">Alert Threshold (%)</label>
          {{ form.threshold }}
        </div>
        <div class="mb-3">
          <label for="id_start_date" class="form-label">Start Date</label>
          {{ form.start_date }}
        </div>
        <div class="mb-3">
          <label for="id_end_date" class="form-label">End Date</label>
          {{ form.end_date }}
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
