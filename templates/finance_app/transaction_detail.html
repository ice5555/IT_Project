<div>
    <h4>Transaction Details</h4>
    <p><strong>Date:</strong> {{ transaction.date|date:"Y-m-d H:i" }}</p>
    <p><strong>Type:</strong> {{ transaction.get_transaction_type_display }}</p>
    <p><strong>Category:</strong> {{ transaction.category }}</p>
    <p><strong>Account:</strong> {{ transaction.account.name }}</p>
    <p><strong>Amount:</strong> £{{ transaction.amount }}</p>
    <p><strong>Note:</strong> {{ transaction.note }}</p>
  </div>
